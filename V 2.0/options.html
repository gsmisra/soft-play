<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Quick Spy Options</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        padding: 20px 40px;
        background-color: #2b2b2b;
        color: #dcdcdc;
      }
      .container {
        max-width: 600px;
        margin: 0 auto;
        background-color: #3c3c3c;
        padding: 24px;
        border-radius: 8px;
      }
      h1 {
        color: #fff;
        border-bottom: 1px solid #555;
        padding-bottom: 10px;
      }
      .form-group {
        margin-bottom: 20px;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
      }
      input[type="text"] {
        width: 100%;
        padding: 10px;
        font-size: 14px;
        border: 1px solid #666;
        border-radius: 6px;
        box-sizing: border-box; /* Important */
        background-color: #555;
        color: #dcdcdc;
      }
      input[type="text"]::placeholder {
        color: #999;
      }
      p.help-text {
        font-size: 12px;
        color: #aaa;
        margin-top: 6px;
      }
      button {
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 500;
        background-color: #4a90e2;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover {
        background-color: #357abd;
      }
      #status {
        margin-left: 15px;
        color: #63e6be;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Spy Tool Options</h1>
      <div class="form-group">
        <label for="data-attrs">Preferred `data-` Attributes</label>
        <input
          type="text"
          id="data-attrs"
          placeholder="data-testid, data-cy, data-qa"
        />
        <p class="help-text">
          Comma-separated list of attributes to prioritize for locators.
        </p>
      </div>
      <button id="save-btn">Save</button>
      <span id="status"></span>
    </div>
    <script src="options.js"></script>
  </body>
</html>
