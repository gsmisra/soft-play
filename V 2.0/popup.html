<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Spy</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            width: 250px;
            margin: 0;
            padding: 10px;
            background-color: #2b2b2b;
            color: #dcdcdc;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .header {
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            color: #fff;
        }
       
        /* --- Manual Spy Button --- */
        #toggle-spy {
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
        }
        #toggle-spy.enabled {
            background-color: #555;
            color: #dcdcdc;
        }
        #toggle-spy.disabled {
            background-color: #d94a4a;
            color: white;
        }
        #toggle-spy:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* --- NEW: Auto Mode Slider --- */
        .auto-mode-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px;
            border-top: 1px solid #444;
            border-bottom: 1px solid #444;
        }
        .auto-mode-container.disabled {
            opacity: 0.5;
            color: #888;
        }
        .auto-mode-container label {
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }
        /* The switch - a checkbox hidden */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        /* The slider */
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #555;
            transition: .4s;
            border-radius: 28px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #4a90e2;
        }
        input:checked + .slider:before {
            transform: translateX(22px);
        }
        input:disabled + .slider {
            cursor: not-allowed;
            background-color: #333;
        }

        /* --- Options Link --- */
        #options-link {
            color: #8ab4f8;
            text-decoration: none;
            font-size: 12px;
            text-align: center;
        }
        #options-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">Quick Spy</div>
       
        <!-- Manual Spy Button -->
        <button id="toggle-spy" class="disabled">Enable Manual Spy</button>

        <!-- Auto Mode Slider -->
        <div class="auto-mode-container" id="auto-mode-wrapper">
            <label for="auto-spy-toggle">Auto Mode</label>
            <div class="switch">
                <input type="checkbox" id="auto-spy-toggle">
                <span class="slider"></span>
            </div>
        </div>
       
        <!-- Options Page Link -->
        <a href="#" id="options-link">Options</a>
    </div>
    <script src="popup.js"></script>
</body>
</html>
